<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Communications Strategy Roadmap</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <div class="container">
        <h1>Research Communications Strategy <br>- A Roadmap</h1>
        <h2>Destination: Effective Research Impact</h2>
        <div class="roadmap">
            <div class="road">
                <div class="dashed-line"></div>
            </div>
            <img src="van.png" alt="Red van" class="car" id="car">
            <div class="roadblock" id="roadblock1">1</div>
            <div class="roadblock" id="roadblock2">2</div>
            <div class="roadblock" id="roadblock3">3</div>
            <div class="roadblock" id="roadblock4">4</div>
            <div class="roadblock" id="roadblock5">5</div>
            <div class="roadblock" id="roadblock6">6</div>
            <div class="flag" id="flag">🏁</div>
            <div class="finish-line"></div>
        </div>
    </div>
    
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-header">
                <h2 id="modalProblem"></h2>
            </div>
            <div class="modal-body">
                <p id="modalDescription"></p>
                <div id="solutionContainer" class="hidden">
                    <h3>Solution:</h3>
                    <p id="modalSolution"></p>
                    <div id="modalSolutionDescription"></div>
                    <!-- The image will be inserted here by JavaScript -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="nextButton" class="btn">Solution</button>
            </div>
        </div>
    </div>
    
    <a href="Timeline.html" class="page-arrow back-arrow" aria-label="Go to previous page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    
    <a href="Closing.html" class="page-arrow next-arrow" aria-label="Go to next page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <script src="script.js"></script>
</body>
</html>
